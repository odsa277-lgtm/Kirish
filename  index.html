<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: system-ui, Arial, sans-serif; color: #1f2937;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899, #f59e0b);
      background-size: 300% 300%; animation: bg 12s ease infinite;
    }
    @keyframes bg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card { background: #fff; width: min(92vw, 400px); padding: 28px; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: pop .5s ease both; text-align: center; }
    h2 { margin: 0 0 18px; }
    .tabs { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b; transition: .25s; }
    .tabs button.active { background: #fff; color: #4f46e5; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; transition: .2s; }
    input:focus { outline: 0; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    .btn { width: 100%; padding: 12px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.15); }
    .btn:active { transform: scale(.98); }
    .primary { background: #4f46e5; color: #fff; }
    .danger { background: #ef4444; color: #fff; margin-top: 16px; }
    #msg { min-height: 20px; font-size: 14px; margin-top: 10px; color: #ef4444; }
    .spinner { width: 34px; height: 34px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 20px auto; }
    #authView, #appView { display: none; }
    .secret { background: #eef2ff; padding: 14px; border-radius: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading"><div class="spinner"></div></div>

    <!-- Kirish oynasi -->
    <div id="authView">
      <h2>Xush kelibsiz</h2>
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="setMode('login')">Kirish</button>
        <button id="tabSignup" onclick="setMode('signup')">Ro'yxatdan o'tish</button>
      </div>
      <input id="username" placeholder="Ismingiz (username)" autocomplete="username">
      <input id="password" type="password" placeholder="Parol (kamida 6 ta belgi)" autocomplete="current-password">
      <button class="btn primary" id="mainBtn" onclick="submitForm()">Kirish</button>
      <div id="msg"></div>
    </div>

    <!-- Himoyalangan sahifa -->
    <div id="appView">
      <h2 id="uname"></h2>
      <div class="secret">🔒 Bu qism faqat tizimga kirgan foydalanuvchilarga ko'rinadi.</div>
      <button class="btn danger" onclick="logout()">Chiqish</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, updateProfile, signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Firebase Console → Project settings → Your apps → Web app'dan oling
    const firebaseConfig = {
      apiKey: "SIZNING_API_KEY",
      authDomain: "SIZNING_PROJECT.firebaseapp.com",
      projectId: "SIZNING_PROJECT",
      appId: "SIZNING_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);
    let mode = "login";

    // Firebase email talab qiladi, shuning uchun ismni ichki email shakliga o'giramiz.
    // Foydalanuvchi buni ko'rmaydi.
    const toEmail = name => name.trim().toLowerCase() + "@users.myapp.com";

    const errors = {
      "auth/invalid-credential": "Ism yoki parol noto'g'ri.",
      "auth/user-not-found": "Bunday foydalanuvchi topilmadi.",
      "auth/wrong-password": "Parol noto'g'ri.",
      "auth/email-already-in-use": "Bu ism band, boshqasini tanlang.",
      "auth/weak-password": "Parol kamida 6 ta belgidan iborat bo'lsin.",
      "auth/too-many-requests": "Juda ko'p urinish. Birozdan so'ng qayta urining."
    };

    const show = t => $("msg").textContent = t;

    window.setMode = m => {
      mode = m;
      $("tabLogin").classList.toggle("active", m === "login");
      $("tabSignup").classList.toggle("active", m === "signup");
      $("mainBtn").textContent = m === "signup" ? "Ro'yxatdan o'tish" : "Kirish";
      $("password").autocomplete = m === "signup" ? "new-password" : "current-password";
      show("");
    };

    window.submitForm = async () => {
      const username = $("username").value.trim();
      const pass = $("password").value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        return show("Ism 3-20 ta harf, raqam yoki _ dan iborat bo'lsin.");
      }
      try {
        if (mode === "signup") {
          const cred = await createUserWithEmailAndPassword(auth, toEmail(username), pass);
          await updateProfile(cred.user, { displayName: username });
          await setDoc(doc(db, "users", cred.user.uid), {
            username, createdAt: serverTimestamp()
          });
        } else {
          await signInWithEmailAndPassword(auth, toEmail(username), pass);
        }
      } catch (e) { show(errors[e.code] || e.message); }
    };

    window.logout = () => signOut(auth);

    // Kirgan bo'lsa himoyalangan sahifa, aks holda kirish oynasi.
    // Brauzer sessiyani eslab qoladi, keyingi safar qayta kirish shart emas.
    onAuthStateChanged(auth, user => {
      $("loading").style.display = "none";
      if (user) {
        $("authView").style.display = "none";
        $("appView").style.display = "block";
        $("uname").textContent = "Salom, " + (user.displayName || "foydalanuvchi") + "!";
      } else {
        $("appView").style.display = "none";
        $("authView").style.display = "block";
      }
    });
  </script>
</body>
</html>
